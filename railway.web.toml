# Serviço Web (Next.js) — balanced-endurance
# Settings → Config-as-code → Config File Path = railway.web.toml
#
# Variable (também no Build, se a UI tiver "Available at Build Time"):
#   NEXT_PUBLIC_API_URL=https://equilibrio-clinica-production.up.railway.app/api

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
startCommand = "npm run start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
