# Serviço Web (Next.js)
# No Railway → balanced-endurance → Settings → Config-as-code
# Config File Path = railway.web.toml
#
# Variable obrigatória:
#   NEXT_PUBLIC_API_URL=https://equilibrio-clinica-production.up.railway.app/api

[build]
builder = "NIXPACKS"
buildCommand = "npm run build:web"

[deploy]
startCommand = "npm run start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
