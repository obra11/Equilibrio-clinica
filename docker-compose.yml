services:
  db:
    image: postgres:16-alpine
    container_name: equilibrio-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: equilibrio
      POSTGRES_PASSWORD: equilibrio
      POSTGRES_DB: equilibrio
    volumes:
      - equilibrio_pg:/var/lib/postgresql/data

volumes:
  equilibrio_pg:
